<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101513">
  <title>Boon Picker | Deadlock</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <main class="layout">
    <section class="picker" aria-label="Boon level picker">
      <div class="summary" aria-live="polite" aria-atomic="true">
        <div class="summary-top">
          <div>
            <div class="label">TOTAL SOULS REQUIRED</div>
            <div class="souls-value"><span id="soulsValue">600</span><span class="soul-unit">SOULS</span></div>
          </div>
          <div class="level-stamp"><span class="label">BOON LEVEL</span><strong id="levelValue">00</strong></div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Selected boon progression" aria-valuemin="0" aria-valuemax="35" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="summary-bottom">
          <span id="rewardValue">LEVEL 1 · ABILITY POINT</span>
          <span class="unspent-display">UNSPENT AP <b id="unspentValue">0</b></span>
          <span class="unlock-bank">UNSPENT UNLOCKS <b id="unspentUnlocks">1 BASIC · 0 ULT</b></span>
          <span id="nextValue">NEXT 800</span>
        </div>
      </div>

      <section class="build-section" aria-labelledby="buildTitle">
        <div class="section-heading">
          <div><h2 id="buildTitle">BUILD ORDER</h2></div>
          <div class="stepper" aria-label="Manage ability order">
            <button type="button" class="reset-button" id="undoButton" title="Undo the last ability choice" disabled>UNDO</button>
            <button type="button" class="reset-button" id="resetButton" title="Clear the ability order">RESET</button>
          </div>
        </div>
        <button type="button" class="gain-level-button" id="gainLevelButton">GAIN LEVEL <span>BANK +1 ABILITY POINT</span></button>
        <div class="build-order" id="buildOrder" role="group" aria-label="Choose abilities and view assignment order" aria-live="polite">
          <button type="button" class="ability-track" data-ability="ability-1">
            <strong class="track-name">ABILITY 1</strong><span class="track-line" aria-hidden="true"></span><span class="track-choice"><span class="ability-status">LOCKED</span><span class="ability-action">UNLOCK</span></span>
          </button>
          <button type="button" class="ability-track" data-ability="ability-2">
            <strong class="track-name">ABILITY 2</strong><span class="track-line" aria-hidden="true"></span><span class="track-choice"><span class="ability-status">LOCKED</span><span class="ability-action">UNLOCK</span></span>
          </button>
          <button type="button" class="ability-track" data-ability="ability-3">
            <strong class="track-name">ABILITY 3</strong><span class="track-line" aria-hidden="true"></span><span class="track-choice"><span class="ability-status">LOCKED</span><span class="ability-action">UNLOCK</span></span>
          </button>
          <button type="button" class="ability-track is-ultimate" data-ability="ultimate">
            <strong class="track-name">ULTIMATE</strong><span class="track-line" aria-hidden="true"></span><span class="track-choice"><span class="ability-status">LOCKED</span><span class="ability-action">UNLOCK</span></span>
          </button>
        </div>
      </section>

      <footer class="source-line">
        <span>PROGRESSION DATA</span>
        <a href="https://deadlock.wiki/Boon" target="_blank" rel="noreferrer">DEADLOCK WIKI: BOON <span aria-hidden="true">↗</span></a>
        <a href="https://deadlock.wiki/Abilities" target="_blank" rel="noreferrer">ABILITY POINTS <span aria-hidden="true">↗</span></a>
      </footer>
    </section>
  </main>
  <script id="boon-levels" type="application/json">{{ levels|tojson }}</script>
  <script id="ability-tier-costs" type="application/json">{{ ability_tier_costs|tojson }}</script>
</body>
</html>
